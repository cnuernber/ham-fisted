name: Automated tests

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Keeps other Java version tests running even if one fails
      matrix:
        java-version: [11, 17, 19, 21, 22]

    steps:
    - uses: actions/checkout@v4

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.m2/repository
          ~/.deps.clj
        key: cljdeps-${{ hashFiles('deps.edn') }}
        restore-keys: |
          cljdeps-

    - name: Mise-en-place setup
      uses: jdx/mise-action@v2
      with:
        install: true
        cache: true

    - name: Setup Clojure
      uses: DeLaGuardo/setup-clojure@12.5
      with:
        cli: 1.11.1.1413

    - name: Run automated tests
      run: |
        mise use java@corretto-${{ matrix.java-version }}
        java -version
        scripts/run-tests